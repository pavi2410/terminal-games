[project]
name = "terminal-games"
version = "0.1.0"
description = "Collection of hand-coded terminal-based games"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "blessed>=1.48.0",
    "rich>=15.0.0",
]

[project.scripts]
terminal-games = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
